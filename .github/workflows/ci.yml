name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The runner's system Python is "externally managed" (PEP 668), so install into a venv.
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev,aws,xgb]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Unit tests (integration tests skip without local data)
        run: .venv/bin/python -m pytest -q

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthesize CloudFormation (no AWS credentials needed)
        working-directory: infra
        run: |
          pip install -r requirements.txt
          npx --yes aws-cdk@2 synth --app "python app.py" > /dev/null
          echo "CDK synth OK"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rosterfit:ci .
