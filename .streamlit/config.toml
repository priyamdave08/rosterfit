# Theme values mirror src/rosterfit/viz/palette.py (tests/test_palette.py keeps them in sync).
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EEE6"
textColor = "#16191D"
borderColor = "#D9D4C9"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "3px"
linkColor = "#1F3A5F"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontSizes = ["2.5rem", "1.75rem", "1.35rem", "1.1rem", "1rem", "0.9rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 500
dataframeHeaderBackgroundColor = "#F1EEE6"
dataframeBorderColor = "#D9D4C9"
chartCategoricalColors = ["#1F3A5F", "#B5501A", "#2A7A5E", "#8C6D1F", "#6A5D86", "#5E6B73"]
chartDivergingColors = ["#2A6496", "#5E86AA", "#9AA7B2", "#EFEBE3", "#C9A27E", "#C26A45", "#B83C2A"]
redColor = "#B23A2E"
greenColor = "#2A7A5E"
orangeColor = "#8A5F00"
yellowColor = "#8A5F00"
blueColor = "#1F3A5F"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
